version: '3'
services:
  opentsdb:
    image: petergrace/opentsdb-docker
    container_name: opentsdb-{{ suffix }}
    ports:
      - "4242:4242"
    networks:
      - {{ networks }}
    environment:
      - TSD_HTTP_ENABLED=true
      - TSD_HTTP_PORT=4242
      - TSD_STORAGE_HBASE=true
      - TSD_STORAGE_HBASE_ZK_QUORUM=zookeeper:2181

  grafana:
    image: grafana/grafana-oss:10.2.1
    container_name: grafana-{{ suffix }}
    ports:
      - "3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    networks:
      - {{ networks }}
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD={{ password }}
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_NAME=Main Org.
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_USERS_DEFAULT_THEME=light   
networks:
  {{ networks }}:
    driver: bridge