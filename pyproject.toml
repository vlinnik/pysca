[build-system]
requires = ["setuptools>=61.0","wheel","setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
version_scheme = "post-release"
#local_scheme = "dirty-tag"
write_to = "src/pysca/__version__.py"

#[tool.git-versioner]
#snapshot = true
#short = true
#desc = true
#use_git_versioner="short,desc,snapshot"

[tool.setuptools]
include-package-data = true
py-modules = ["pyscaplugin","pysca","animation","runtimetrend"] 

[tool.setuptools.packages.find]
where = ["src"]
exclude = []

[tool.setuptools.package-data]
pysca = ["data/*","**/*.scada", "**/*.yaml", "**/*.ui", "**/LICENCE","**/README.md", "**/*.toml"]

[project]
dynamic = ["version"]
name = "pysca"
authors = [
  { name="Linnik V.V.", email="vlinnik@mail.ru" },
]
description = "Framework for developing Python+Qt GUI"
readme = "README.md"
license = { file="LICENSE" }
requires-python = ">=3.7"
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]
dependencies = ['qtpy', 'sqlalchemy','click','opentsdb_client','grafana_client','pystray','watchdog','pyyaml','qasync','PythonQwt','loguru','typer','ruamel.yaml','jinja2']

[project.urls]
"Homepage" = "https://github.com/vlinnik/pysca"
"Bug Tracker" = "https://github.com/vlinnik/pysca/issues"

[project.scripts]
pysca = "pysca.cli.__main__:entry"

[project.entry-points."pysca.projects"] 
